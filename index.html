<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pattern Swap</title>
    <link rel="stylesheet" href="src/css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden; }
        .screen { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .screen.active { display: flex; opacity: 1; }
        
        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }
        .glass-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* Vibrant Mesh Gradient Background */
        .mesh-bg {
            background-color: #0f0c29;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        }
        
        /* Puzzle Mechanics Styles */
        .tile-card {
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
            touch-action: none;
            cursor: pointer;
        }
        .tile-card.selected {
            transform: scale(1.08) !important;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.8), 0 0 0 3px #f59e0b !important;
            z-index: 30;
        }
        .tile-card.dragging {
            opacity: 0.85;
            transform: scale(1.1) !important;
            z-index: 40;
            cursor: grabbing;
        }
        .tile-card.fixed-tile {
            cursor: not-allowed;
            filter: brightness(0.9);
        }
        .edge-glow-h {
            position: absolute;
            height: 4px;
            background: linear-gradient(90deg, transparent, #34d399, transparent);
            box-shadow: 0 0 8px #34d399;
            z-index: 20;
            animation: pulseGlow 1.5s infinite alternate;
            pointer-events: none;
        }
        .edge-glow-v {
            position: absolute;
            width: 4px;
            background: linear-gradient(180deg, transparent, #34d399, transparent);
            box-shadow: 0 0 8px #34d399;
            z-index: 20;
            animation: pulseGlow 1.5s infinite alternate;
            pointer-events: none;
        }
        @keyframes pulseGlow {
            0% { opacity: 0.6; filter: drop-shadow(0 0 2px #34d399); }
            100% { opacity: 1; filter: drop-shadow(0 0 8px #34d399); }
        }
        .victory-board-glow {
            animation: victoryPulse 1.8s ease-in-out infinite alternate, borderFlash 0.9s ease-out 2;
            box-shadow: 0 0 35px rgba(52, 211, 153, 0.9), 0 0 70px rgba(245, 158, 11, 0.6) !important;
            border-color: #34d399 !important;
        }
        @keyframes victoryPulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.025); filter: brightness(1.2); }
            100% { transform: scale(1); filter: brightness(1.1); }
        }
        @keyframes borderFlash {
            0% { background: rgba(52, 211, 153, 0.35); }
            100% { background: rgba(15, 23, 42, 0.75); }
        }
        .coin-pop {
            animation: coinPopAnim 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes coinPopAnim {
            0% { transform: scale(0.6); opacity: 0; }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="h-full w-full flex flex-col mesh-bg text-slate-100 font-sans pb-[env(safe-area-inset-bottom)] pt-[env(safe-area-inset-top)]">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="screen active flex-col items-center justify-center w-full h-full absolute inset-0 z-50 bg-[#0f0c29]">
        <i class="fa-solid fa-puzzle-piece text-6xl text-amber-400 mb-6 drop-shadow-[0_0_15px_rgba(251,191,36,0.6)]"></i>
        <h1 class="font-display font-extrabold text-4xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-purple-400">PATTERN</h1>
        <h1 class="font-display font-extrabold text-4xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-amber-200">SWAP</h1>
        <p class="text-slate-400 mt-2 tracking-widest text-sm uppercase">Eternity Reborn</p>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div id="menu-screen" class="screen flex-col items-center justify-between w-full h-full absolute inset-0 p-6 z-40 hidden">
        <div class="absolute top-6 right-6 flex items-center gap-2 bg-emerald-950/50 px-4 py-2 rounded-full border border-emerald-500/30 z-[100]">
            <i class="fa-solid fa-coins text-emerald-400"></i>
            <span class="font-bold text-emerald-100 coin-balance-display">0</span>
        </div>
        <div class="mt-20 flex flex-col items-center">
            <div class="w-24 h-24 glass-panel rounded-3xl flex items-center justify-center mb-6 border-amber-500/30 shadow-[0_0_30px_rgba(251,191,36,0.15)]">
                <i class="fa-solid fa-shapes text-5xl text-amber-400"></i>
            </div>
            <h1 class="font-display font-black text-5xl tracking-wider text-transparent bg-clip-text bg-gradient-to-br from-white via-amber-100 to-purple-300">PATTERN</h1>
            <h1 class="font-display font-black text-4xl tracking-wider text-white drop-shadow-md">SWAP</h1>
        </div>
        
        <div class="w-full max-w-sm flex flex-col gap-4 mb-10">
            <button id="btn-play" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-purple-600 text-white font-display font-bold text-xl tracking-widest shadow-[0_4px_20px_rgba(251,191,36,0.3)] active:scale-95 transition-transform border border-white/20">
                PLAY CAMPAIGN
            </button>
            <div class="flex gap-4">
                <button id="btn-freeplay" class="flex-1 py-3 rounded-2xl glass-btn text-amber-100 font-bold tracking-wide flex items-center justify-center gap-2">
                    <i class="fa-solid fa-infinity text-amber-400"></i> FREE PLAY
                </button>
                <button id="btn-menu-leaderboard" class="flex-1 py-3 rounded-2xl glass-btn text-purple-100 font-bold tracking-wide flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trophy text-purple-400"></i> RANKS
                </button>
            </div>
            <div class="flex gap-4">
                <button id="btn-shop" class="flex-1 py-3 rounded-2xl glass-btn text-emerald-100 font-bold tracking-wide flex items-center justify-center gap-2">
                    <i class="fa-solid fa-store text-emerald-400"></i> SHOP
                </button>
                <button id="btn-settings" class="flex-1 py-3 rounded-2xl glass-btn text-slate-200 font-bold tracking-wide flex items-center justify-center gap-2">
                    <i class="fa-solid fa-gear text-slate-400"></i> SETTINGS
                </button>
            </div>
        </div>
    </div>

    <!-- LEVEL SELECT SCREEN -->
    <div id="level-select-screen" class="screen flex-col w-full h-full absolute inset-0 z-40 hidden p-4">
        <header class="flex items-center justify-between mb-6 pt-4">
            <button id="btn-levels-back" class="w-12 h-12 glass-btn rounded-xl flex items-center justify-center text-white">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 class="font-display font-bold text-2xl text-white tracking-widest">CAMPAIGN</h2>
            <div class="w-12 h-12"></div> <!-- Spacer -->
        </header>
        
        <div class="flex-1 overflow-y-auto pb-10">
            <div id="levels-grid-container" class="grid grid-cols-4 gap-3">
                <!-- Populated via JS -->
            </div>
        </div>
    </div>

    <!-- LEADERBOARD SCREEN -->
    <div id="leaderboard-screen" class="screen flex-col w-full h-full absolute inset-0 z-40 hidden p-4">
        <header class="flex items-center justify-between mb-4 pt-4">
            <button id="btn-lb-back" class="w-12 h-12 glass-btn rounded-xl flex items-center justify-center text-white">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 class="font-display font-bold text-xl text-white tracking-widest">GLOBAL RANKS</h2>
            <button id="btn-edit-profile" class="glass-btn px-3 py-2 rounded-xl text-xs font-bold text-amber-300 flex items-center gap-1">
                <i class="fa-solid fa-pencil"></i> <span id="lb-profile-name">Player</span>
            </button>
        </header>
        
        <div class="flex-1 glass-panel rounded-3xl p-4 overflow-y-auto flex flex-col gap-2 relative">
             <div id="leaderboard-list" class="flex flex-col gap-2">
                 <!-- Populated via JS -->
                 <div class="text-center text-slate-400 mt-10 text-sm">Loading Leaderboard...</div>
             </div>
        </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="gameplay-screen" class="screen flex-col w-full h-full absolute inset-0 z-40 hidden bg-slate-50">
        <header class="w-full px-4 pt-6 pb-2 flex items-center justify-between">
            <button id="btn-game-back" class="w-12 h-12 bg-white border-2 border-slate-200 rounded-xl shadow-sm text-slate-600 font-bold active:scale-95 transition flex items-center justify-center">
                <i class="fa-solid fa-arrow-left text-lg text-slate-600"></i>
            </button>
            
            <div class="flex flex-col items-center">
                <span id="level-title-display" class="font-display font-black text-xl tracking-wide text-slate-800">LEVEL 1</span>
                <span id="grid-size-subtitle" class="text-xs text-slate-500 font-bold">3 x 3 Grid</span>
            </div>

            <button id="btn-game-settings" class="w-12 h-12 bg-white border-2 border-slate-200 rounded-xl shadow-sm text-slate-600 font-bold active:scale-95 transition flex items-center justify-center">
                <i class="fa-solid fa-pause text-lg text-slate-600"></i>
            </button>
        </header>

        <section class="w-full px-4 py-3 flex items-center justify-between text-xs font-bold text-slate-500 gap-2">
            <div class="flex-1 flex flex-col items-center bg-white rounded-xl py-2 border-2 border-slate-200 shadow-sm">
                <i class="fa-solid fa-puzzle-piece text-emerald-400 mb-1"></i>
                <strong id="match-counter" class="text-slate-800 text-sm transition-all duration-300 transform inline-block">0/0</strong>
            </div>
            <div class="flex-1 flex flex-col items-center bg-white rounded-xl py-2 border-2 border-slate-200 shadow-sm">
                <i class="fa-solid fa-arrows-rotate text-amber-400 mb-1"></i>
                <strong id="move-counter" class="text-slate-800 text-sm">0</strong>
            </div>
            <div class="flex-1 flex flex-col items-center bg-white rounded-xl py-2 border-2 border-slate-200 shadow-sm">
                <i class="fa-solid fa-clock text-sky-400 mb-1"></i>
                <strong id="timer-display" class="text-slate-800 text-sm">00:00</strong>
            </div>
        </section>

        <main class="flex-1 w-full flex flex-col items-center justify-center px-4 py-2 relative">
            <div id="board-outer-frame" class="relative p-3 rounded-3xl bg-white shadow-xl border-4 border-slate-200 transition-all w-full max-w-[380px] aspect-square flex items-center justify-center">
                <canvas id="particle-canvas" class="absolute inset-0 pointer-events-none z-50 w-full h-full rounded-3xl"></canvas>
                <div id="puzzle-board" class="relative w-full h-full grid gap-0 bg-slate-300 p-1 rounded-2xl border-4 border-slate-300 overflow-hidden">
                </div>
                <div id="edge-overlay-container" class="absolute inset-0 pointer-events-none z-20"></div>
            </div>
        </main>

        <footer class="w-full px-4 pb-8 pt-2 flex items-center justify-around gap-3">
            <button id="btn-undo" class="flex-1 py-3 flex flex-col items-center justify-center rounded-2xl bg-blue-100 border-2 border-blue-200 text-blue-700 shadow-sm font-bold tracking-wide active:scale-95 disabled:opacity-40 disabled:pointer-events-none">
                <i class="fa-solid fa-rotate-left text-lg mb-1 text-blue-500"></i>
                <span class="text-[10px] uppercase font-bold tracking-wider">Undo</span>
            </button>
            <button id="btn-hint" class="flex-1 py-3 rounded-2xl bg-amber-100 border-2 border-amber-200 text-amber-700 font-bold tracking-wide flex flex-col items-center justify-center gap-1 active:scale-95 shadow-sm">
                <div class="flex items-center gap-2"><i class="fa-solid fa-lightbulb text-amber-400"></i> HINT</div>
                <div class="text-[10px] text-amber-600/80 font-medium flex items-center gap-1"><i class="fa-solid fa-coins"></i> 150</div>
            </button>
            <button id="btn-reset" class="flex-1 py-3 flex flex-col items-center justify-center rounded-2xl bg-rose-100 border-2 border-rose-200 text-rose-700 shadow-sm font-bold tracking-wide active:scale-95">
                <i class="fa-solid fa-arrow-rotate-right text-lg mb-1 text-rose-500"></i>
                <span class="text-[10px] uppercase font-bold tracking-wider">Restart</span>
            </button>
        </footer>
    </div>

    <!-- OVERLAYS -->
    <!-- Victory Overlay -->
    <div id="victory-overlay" class="screen fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4 hidden">
        <div class="w-full max-w-sm glass-panel rounded-3xl p-8 flex flex-col items-center border-amber-500/30 shadow-[0_0_50px_rgba(251,191,36,0.2)]">
            <i class="fa-solid fa-crown text-5xl text-amber-400 mb-2 drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]"></i>
            <h2 class="font-display font-black text-3xl text-white tracking-widest mb-1">VICTORY</h2>
            <p id="victory-subtitle" class="text-amber-200 text-sm font-medium mb-4">Level Solved!</p>
            
            <div id="victory-stars" class="flex gap-2 mb-6">
                <!-- Stars injected by JS -->
            </div>
            
            <div class="w-full flex justify-between bg-black/30 rounded-xl p-4 mb-6 border border-white/10">
                <div class="text-center">
                    <div class="text-xs text-slate-400 mb-1">MOVES</div>
                    <div id="victory-moves" class="font-display font-bold text-xl text-white">0</div>
                </div>
                <div class="text-center">
                    <div class="text-xs text-slate-400 mb-1">TIME</div>
                    <div id="victory-time" class="font-display font-bold text-xl text-white">00:00</div>
                </div>
                <div class="text-center">
                    <div class="text-xs text-slate-400 mb-1">COINS</div>
                    <div id="victory-coins" class="font-display font-bold text-xl text-amber-400">+50</div>
                </div>
            </div>
            
            <button id="btn-victory-next" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-900 font-bold text-lg tracking-widest shadow-[0_0_20px_rgba(251,191,36,0.4)] active:scale-95 transition-transform">
                NEXT LEVEL
            </button>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="screen fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4 hidden">
        <div class="w-full max-w-sm glass-panel rounded-3xl p-6 border-white/20">
            <h2 class="font-display font-bold text-2xl text-white tracking-widest mb-6">SETTINGS</h2>
            
            <div class="flex items-center justify-between bg-black/30 p-4 rounded-xl mb-3 border border-white/5">
                <div class="flex items-center gap-3 text-white">
                    <i class="fa-solid fa-music text-purple-400 w-5"></i>
                    <span class="font-bold">Music</span>
                </div>
                <button id="toggle-music" class="w-12 h-6 rounded-full bg-purple-500 relative transition-colors">
                    <div class="w-5 h-5 bg-white rounded-full absolute right-0.5 top-0.5 transition-transform"></div>
                </button>
            </div>
            
            <div class="flex items-center justify-between bg-black/30 p-4 rounded-xl mb-6 border border-white/5">
                <div class="flex items-center gap-3 text-white">
                    <i class="fa-solid fa-volume-high text-amber-400 w-5"></i>
                    <span class="font-bold">Sound Effects</span>
                </div>
                <button id="toggle-sfx" class="w-12 h-6 rounded-full bg-amber-500 relative transition-colors">
                    <div class="w-5 h-5 bg-white rounded-full absolute right-0.5 top-0.5 transition-transform"></div>
                </button>
            </div>
            
            <button id="btn-settings-close" class="w-full py-3 rounded-2xl glass-btn text-white font-bold tracking-widest active:scale-95">
                CLOSE
            </button>
        </div>
    </div>


    <div id="shop-overlay" class="screen fixed inset-0 z-[60] flex flex-col bg-[#0f0c29] hidden">
        <header class="w-full px-6 pt-8 pb-4 flex items-center justify-between bg-black/40 backdrop-blur-md border-b border-white/10">
            <button id="btn-shop-close" class="w-10 h-10 rounded-full glass-btn flex items-center justify-center text-white">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 class="font-display font-black text-2xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-teal-400">SHOP</h2>
            <div class="flex items-center gap-2 bg-emerald-950/50 px-3 py-1.5 rounded-full border border-emerald-500/30">
                <i class="fa-solid fa-coins text-emerald-400 text-sm"></i>
                <span class="font-bold text-emerald-100 text-sm coin-balance-display">0</span>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto p-6 flex flex-col gap-8" id="shop-content-container"></div>
    </div>

    <script src="src/js/economy_service.js"></script>
    <script src="src/js/levels.js"></script>
    <script src="src/js/game.js"></script>
    <script src="src/js/leaderboard_service.js"></script>
    <script src="src/js/admob_service.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
